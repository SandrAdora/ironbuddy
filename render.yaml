services:

  # ── Django Backend ──────────────────────────────────────────────
  - type: web
    name: ironbuddy-backend
    runtime: python
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "cd backend && gunicorn backend.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: GROQ_API_KEY
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: ironbuddy-db
          property: connectionString

  # ── Socket Server ───────────────────────────────────────────────
  - type: web
    name: ironbuddy-socket
    runtime: node
    rootDir: socket-server
    buildCommand: "npm install"
    startCommand: "npm start"
    envVars:
      - key: PORT
        value: "3001"

  # ── React Frontend ──────────────────────────────────────────────
  - type: web
    name: ironbuddy-frontend
    runtime: static
    rootDir: iron
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: ironbuddy-db
    databaseName: ironbuddy
    plan: free
